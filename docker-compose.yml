version: "3.8"

services:
  recognition:
    build:
      context: ./recognizer
      dockerfile: Dockerfile
    container_name: recognition
    expose:
      - "8000"
    ports:
      - "3002:8000"
    volumes:
      - ./recognizer:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped

  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - recognition
  #   restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"     # port akses S3 API
      - "9001:9001"     # port akses MinIO Console (UI)
    environment:
      MINIO_ROOT_USER: minioadmin       # username login
      MINIO_ROOT_PASSWORD: minioadmin   # password login
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  minio-data: