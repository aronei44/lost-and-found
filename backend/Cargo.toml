[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.4", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
argon2 = "0.5"
utoipa = { version = "5.3.1", features = ["chrono"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["axum"] }
once_cell = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6.4", features = ["trace", "cors"] }
clap = { version = "4", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "macros", "uuid", "chrono", "runtime-tokio-rustls", "runtime-tokio-native-tls"] }
chrono = { version = "0.4.41", features = ["serde"] }
bcrypt = "0.17.0"
mime = "0.3.17"
bytes = "1.10.1"
reqwest = { version = "0.12.18", features = ["json", "multipart"] }
futures = "0.3.31"
