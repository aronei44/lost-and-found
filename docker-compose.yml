version: "3.8"

services:
  recognition:
    build:
      context: ./recognizer
      dockerfile: Dockerfile
    container_name: recognition
    expose:
      - "8000"
    ports:
      - "3002:8000"
    volumes:
      - ./recognizer:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - recognition
    restart: unless-stopped